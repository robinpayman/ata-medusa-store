<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Gradients for realistic paper texture -->
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F1EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EDE7DF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5DDD3;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow gradient -->
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.05" />
    </linearGradient>

    <!-- Subtle texture pattern -->
    <filter id="paperTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="4" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="#FAFAF8"/>

  <!-- Soft shadow on ground -->
  <ellipse cx="400" cy="920" rx="280" ry="35" fill="#000000" opacity="0.08"/>

  <!-- Main pocket envelope with shadow -->
  <g filter="url(#softShadow)">
    <!-- Pocket body -->
    <path d="M 120 280 L 200 180 L 270 140 L 400 120 L 530 140 L 600 180 L 680 280 L 680 850 Q 680 880 650 880 L 150 880 Q 120 880 120 850 Z" 
          fill="url(#paperGradient)" 
          stroke="#D4C9BC" 
          stroke-width="1.5"
          filter="url(#paperTexture)"/>
  </g>

  <!-- Thumb cutout highlight (subtle) -->
  <path d="M 270 140 Q 300 100 400 80 Q 500 100 530 140" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        opacity="0.6"/>

  <!-- Left crease (fold line) -->
  <path d="M 220 320 Q 225 500 220 750" 
        stroke="#C4B5A0" 
        stroke-width="2" 
        fill="none" 
        opacity="0.6"/>

  <!-- Right crease (fold line) -->
  <path d="M 580 320 Q 575 500 580 750" 
        stroke="#C4B5A0" 
        stroke-width="2" 
        fill="none" 
        opacity="0.6"/>

  <!-- Center vertical fold -->
  <path d="M 400 250 L 400 820" 
        stroke="#D4C9BC" 
        stroke-width="1.5" 
        fill="none" 
        opacity="0.4"/>

  <!-- Horizontal flap line -->
  <path d="M 160 380 Q 400 385 640 380" 
        stroke="#C4B5A0" 
        stroke-width="2.5" 
        fill="none" 
        opacity="0.5"/>

  <!-- Subtle wear marks (organic imperfections) -->
  <circle cx="250" cy="450" r="18" fill="#D4C9BC" opacity="0.25"/>
  <circle cx="550" cy="520" r="22" fill="#D4C9BC" opacity="0.2"/>
  <circle cx="300" cy="700" r="15" fill="#D4C9BC" opacity="0.22"/>
  <circle cx="600" cy="650" r="20" fill="#D4C9BC" opacity="0.18"/>

  <!-- Corner wear (subtle darkening) -->
  <path d="M 120 300 Q 130 310 140 310" 
        stroke="#A0917D" 
        stroke-width="1.5" 
        fill="none" 
        opacity="0.3"/>
  <path d="M 680 300 Q 670 310 660 310" 
        stroke="#A0917D" 
        stroke-width="1.5" 
        fill="none" 
        opacity="0.3"/>
  <path d="M 150 850 Q 145 840 155 840" 
        stroke="#A0917D" 
        stroke-width="1.5" 
        fill="none" 
        opacity="0.25"/>
  <path d="M 650 850 Q 655 840 645 840" 
        stroke="#A0917D" 
        stroke-width="1.5" 
        fill="none" 
        opacity="0.25"/>

  <!-- Subtle scratch lines (texture detail) -->
  <line x1="280" y1="380" x2="320" y2="390" stroke="#C4B5A0" stroke-width="0.8" opacity="0.3"/>
  <line x1="550" y1="420" x2="580" y2="410" stroke="#C4B5A0" stroke-width="0.8" opacity="0.25"/>
  <line x1="320" y1="600" x2="360" y2="610" stroke="#C4B5A0" stroke-width="0.8" opacity="0.28"/>
  <line x1="480" y1="700" x2="510" y2="695" stroke="#C4B5A0" stroke-width="0.8" opacity="0.26"/>

  <!-- Subtle gloss/highlight on top edge -->
  <path d="M 130 300 Q 400 250 670 300" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        fill="none" 
        opacity="0.4"
        style="filter: blur(1px)"/>

  <!-- Text/branding area (optional) -->
  <text x="400" y="550" 
        font-family="Georgia, serif" 
        font-size="24" 
        fill="#A0917D" 
        text-anchor="middle" 
        opacity="0.3"
        letter-spacing="3">POCKET</text>

  <!-- Subtle depth shadow inside pocket -->
  <path d="M 140 380 L 660 380 L 660 850 L 140 850 Z" 
        fill="url(#shadowGradient)" 
        opacity="0.15"/>
</svg>